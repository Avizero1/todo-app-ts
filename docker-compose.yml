# docker-compose.yml — описание сервисов проекта, чтобы всё поднималось одной командой.
# Здесь нужно (участник 5): сервис базы PostgreSQL (образ, том для данных, переменные из .env, проверка готовности),
# сервис бэкенда (сборка из backend/Dockerfile, старт после готовности базы, переменные окружения),
# сервис фронтенда (сборка из frontend/Dockerfile, публикация порта), общая сеть.
# По желанию — простой веб-клиент для базы (Adminer) для проверки данных.
